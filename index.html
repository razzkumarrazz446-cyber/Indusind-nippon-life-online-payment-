<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>indusind nipppn life insurance</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#fff,#ffe5e5);
display:flex;
justify-content:center;
align-items:center;
}


.container{
width:95%;
max-width:420px;
text-align:center;
}


.logo{
font-size:36px;
font-weight:bold;
color:red;
margin-bottom:25px;
}

.logo span{
color:#111;
}



.card{

background:rgba(255,255,255,.55);
backdrop-filter:blur(15px);

padding:25px;
border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.15);

}



input{

width:100%;
padding:15px;

border-radius:25px;

border:1px solid #ddd;

font-size:16px;

margin-bottom:12px;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:30px;

background:red;

color:white;

font-size:17px;

cursor:pointer;

}



.details{

display:none;

text-align:left;

background:white;

padding:18px;

border-radius:18px;

margin-top:20px;

line-height:32px;

}



.details span{

color:red;

font-weight:bold;

}



.timer{

display:none;

color:red;

font-size:18px;

margin:20px 0;

}



/* QR Popup */

.popup{

display:none;

position:fixed;

inset:0;

background:white;

z-index:10;

justify-content:center;

align-items:center;

flex-direction:column;

}



.popup img{

width:250px;

border-radius:20px;

}



.close{

background:#111;

width:150px;

margin:15px;

}



/* Success */

.success{

display:none;

position:fixed;

inset:0;

background:white;

z-index:20;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

}



.tick{

font-size:90px;

color:green;

}



</style>

</head>


<body>


<div class="container">


<div class="logo">
KJJ <span>Insurance</span>
</div>



<div class="card">


<h2>Policy Renewal</h2>


<input id="policyInput" placeholder="Enter Policy Number">


<button onclick="searchPolicy()">

🔎 Search Policy

</button>




<div class="details" id="detailsBox">


<p>
<b>Customer Name:</b><br>
<span id="name"></span>
</p>


<p>
<b>Policy Number:</b><br>
<span id="policy"></span>
</p>


<p>
<b>Premium Amount:</b><br>
<span id="premium"></span>
</p>


<p>
<b>Renewal Discount:</b><br>
<span id="discount"></span>
</p>



<h3>

Final Premium Amount:

<br>

<span id="final"></span>

</h3>


</div>





<div class="timer" id="timerBox">

Payment valid for 
<b id="time">15:00</b>

</div>



<button id="payBtn" style="display:none;" onclick="openQR()">

Pay Now

</button>



</div>


</div>






<!-- QR SCREEN -->


<div class="popup" id="qrBox">


<h2>Scan & Pay</h2>


<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=indusindnippponeonlinepayment">


<button class="close" onclick="closeQR()">

Close

</button>


<button onclick="paymentDone()">

I Have Paid

</button>


</div>






<!-- SUCCESS SCREEN -->


<div class="success" id="successBox">


<div class="tick">

✓

</div>


<h1>
Payment Successful
</h1>


<p>
Thank you for choosing indusind nippon life Insurance
</p>


</div>







<script>


let timerStarted=false;



function searchPolicy(){


let policyInput=document.getElementById("policyInput").value;



if(policyInput=="KJJ12345"){



document.getElementById("detailsBox").style.display="block";

document.getElementById("timerBox").style.display="block";

document.getElementById("payBtn").style.display="block";



document.getElementById("name").innerHTML="Rahul Sharma";

document.getElementById("policy").innerHTML="KJJ12345";

document.getElementById("premium").innerHTML="₹10,000";

document.getElementById("discount").innerHTML="₹1,500";

document.getElementById("final").innerHTML="₹8,500";



if(!timerStarted){

startTimer();

timerStarted=true;

}



}

else{

alert("Policy Number Not Found");

}


}




function startTimer(){


let time=900;


let timer=setInterval(()=>{


let min=Math.floor(time/60);

let sec=time%60;



document.getElementById("time").innerHTML=

min+":"+(sec<10?"0":"")+sec;



if(time<=0){

clearInterval(timer);

document.getElementById("payBtn").innerHTML="Payment Expired";

}


time--;


},1000);


}





function openQR(){

document.getElementById("qrBox").style.display="flex";

}



function closeQR(){

document.getElementById("qrBox").style.display="none";

}



function paymentDone(){

document.getElementById("successBox").style.display="flex";

}



</script>


</body>
</html>
